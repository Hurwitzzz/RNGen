# ChordGNN training parameters.
# Replace paths, then run python -m rngen.baselines.train chordgnn.
# Repeat with seed=42,43,44 and distinct output directories for the paper runs.
train_manifest: /path/to/chordgnn_cache/train_npz_paths.txt
validation_manifest: /path/to/chordgnn_cache/validation_npz_paths.txt
cache_report: /path/to/chordgnn_cache/materialization_report.json
# Optional extra read-only CSV roots; the cache report supplies the source roots.
source_root: null
ontology: /path/to/chordgnn_cache/ontology.json
output_dir: /path/to/outputs/chordgnn/seed_42
protocol: formal
epochs: 100
batch_size: 100
seed: 42
learning_rate: 0.0015
weight_decay: 0.005
dropout: 0.5
num_workers: 0
device: cuda
early_stopping_patience: 20
early_stopping_min_delta: 0.0
