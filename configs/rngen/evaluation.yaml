# Shared checkpoint evaluation; the saved checkpoint supplies the model architecture.
# For Key evaluation, override task and json_path as documented in configs/README.md.
task: rna_sft
max_text_length: 2048
use_spelled_musicbert: true
include_spelling_in_prompt: false
spelling_downsampling_scale: 1.0
per_device_eval_batch_size: 1
bf16: true
gradient_checkpointing: true
include_for_metrics:
- loss
- metadata
do_sample: false
num_beams: 4
max_new_tokens: 2048
model_path: /path/to/selected_rngen_checkpoint
json_path: /path/to/rngen/rna/test.json
output_dir: /path/to/outputs/evaluation
