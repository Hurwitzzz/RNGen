# Shared RNGen SFT parameters. Select a stage YAML, not this file.
# Default: one training process; 4 samples/device x accumulation 1 = batch 4.
# Model alternatives and distributed overrides are documented in configs/README.md.
llm_model_name: Qwen/Qwen2.5-7B-Instruct
load_from_fted_rnbert: true
projector_layers: 2
projector_dropout: 0.1
freeze_layers_rnbert: none
freeze_llm: true
freeze_projector: false
use_lora: true
lora_r: 16
lora_alpha: 32
lora_target_modules: all-linear
spelling_downsampling_scale: 1.0
use_spelled_musicbert: true
include_spelling_in_prompt: false
max_text_length: 2048
do_train: true
do_eval: true
eval_strategy: steps
save_total_limit: 2
save_safetensors: true
save_only_model: true
learning_rate: 5.0e-05
lr_scheduler_type: cosine
warmup_ratio: 0.1
per_device_train_batch_size: 4
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
torch_empty_cache_steps: 2
bf16: true
include_for_metrics:
- loss
- metadata
logging_steps: 100
log_level: info
report_to: wandb
push_to_hub: false
gradient_checkpointing: true
load_best_model_at_end: true
greater_is_better: false
prediction_loss_only: true
do_sample: false
num_beams: 4
seed: 42
