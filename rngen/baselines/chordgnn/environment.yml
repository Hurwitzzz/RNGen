# Linux x86_64 environment shared by ChordGNN and ChordGNN+Post.
# Create from the repository root with:
# conda env create -f rngen/baselines/chordgnn/environment.yml
# Activate this environment and run baseline modules from the repository root.
# Install the RNGen core in a separate environment.
name: rngen-chordgnn
channels:
  - pytorch
  - nvidia
  - anaconda
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10.19
  - pip=25.2
  - setuptools=80.9.0
  - wheel=0.45.1
  - pytorch::pytorch=2.4.1
  - pytorch-cuda=12.1
  - cuda-version=12.1
  - anaconda::mkl=2023.1.0
  - anaconda::intel-openmp=2023.1.0
  - numpy=1.26.4
  - pip:
      - --find-links https://data.pyg.org/whl/torch-2.4.0+cu121.html
      - pandas==2.2.3
      - python-dateutil==2.9.0.post0
      - pytz==2025.2
      - tzdata==2025.2
      - scipy==1.10.1
      - partitura==1.3.1
      - music21==8.1.0
      - PyYAML==6.0.2
      - torch-scatter==2.1.2+pt24cu121
