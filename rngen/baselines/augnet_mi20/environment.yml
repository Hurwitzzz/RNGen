# Linux x86_64 environment shared by AugmentedNet and Micchi2020.
# Create from the repository root with:
# conda env create -f rngen/baselines/augnet_mi20/environment.yml
# Activate this environment and run baseline modules from the repository root.
# Install the RNGen core in a separate environment.
name: rngen-augnet-mi20
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.8.20
  - pip=24.3.1
  - setuptools=75.1.0
  - wheel=0.45.1
  - cudatoolkit=11.0.3
  - cudnn=8.0.5.39
  - pip:
      - absl-py==0.11.0
      - astunparse==1.6.3
      - cachetools==4.2.1
      - certifi==2020.12.5
      - chardet==4.0.0
      - flatbuffers==1.12
      - gast==0.3.3
      - google-auth==1.27.0
      - google-auth-oauthlib==0.4.2
      - google-pasta==0.2.0
      - grpcio==1.32.0
      - h5py==2.10.0
      - idna==2.10
      - Keras-Preprocessing==1.1.2
      - Markdown==3.3.3
      - numpy==1.19.5
      - oauthlib==3.1.0
      - opt-einsum==3.3.0
      - pandas==1.2.2
      - protobuf==3.14.0
      - pyasn1==0.4.8
      - pyasn1-modules==0.2.8
      - python-dateutil==2.8.1
      - pytz==2021.1
      - PyYAML==6.0.2
      - requests==2.25.1
      - requests-oauthlib==1.3.0
      - rsa==4.7.1
      - six==1.15.0
      - tensorboard==2.4.1
      - tensorboard-plugin-wit==1.8.0
      - tensorflow==2.4.1
      - tensorflow-estimator==2.4.0
      - termcolor==1.1.0
      - typing-extensions==3.7.4.3
      - urllib3==1.26.3
      - Werkzeug==1.0.1
      - wrapt==1.12.1
