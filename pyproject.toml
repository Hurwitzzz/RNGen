[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rngen"
version = "0.1.0"
authors = [
  { name="Hewei Gao", email="ghw1515489084@gmail.com" },
]
description = "RNGen: RNBERT and language models for Roman numeral analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11,<3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch==2.6.0",
    "transformers==4.51.3",
    "peft==0.15.2",
    "accelerate==1.6.0",
    "numpy==2.2.3",
    "pandas==2.2.3",
    "omegaconf==2.3.0",
    "PyYAML==6.0.2",
    "safetensors==0.5.3",
    "tqdm==4.67.1",
    "wandb==0.19.8",
    "huggingface-hub==0.30.2",
    "musicbert_hf==0.0.1",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7,<4", "seaborn==0.13.2"]

[project.urls]
"Homepage" = "https://github.com/Hurwitzzz/RNGen"

[tool.setuptools.packages.find]
where = ["."]
include = ["rngen", "rngen.*"]
exclude = ["rngen.tests", "rngen.tests.*"]

[tool.setuptools.package-data]
"rngen.data" = ["events_incl_spelling_stoi.json"]
"rngen.config" = ["templates.json", "*.yaml"]
"rngen.baselines.augnet_mi20" = ["environment.yml"]
"rngen.baselines.chordgnn" = ["environment.yml"]
